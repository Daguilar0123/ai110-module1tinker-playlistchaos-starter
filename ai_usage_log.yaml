# AI Usage Log for Playlist Chaos
#
# Structured log of AI-assisted debugging sessions for the "Reflect on Your AI
# Collaborations" step of this assignment. Append one entry to `entries` per
# AI collaboration (at minimum, one per required fix from README.md).
#
# Ordering convention: `entries` is kept in chronological order by
# `timestamp`, not by when it was written into this file. If you're backfilling
# an entry after the fact and its timestamp falls before the last entry
# currently in the list, insert it at its correct chronological position
# rather than appending it at the end — file order should always match
# timestamp order, so a reader (human or AI) can trust top-to-bottom = oldest
# to newest without needing to re-sort.
#
# session_id: the Claude Code session UUID the entry's prompt was made in.
# session_name: a list, not a single string — the session's name over time.
#   The first element is derived from the session's first user message; if the
#   session is later relabeled, append the new name rather than replacing the
#   old one, so the last (rightmost) element is always the current name and
#   the full list is the rename history. Entries from the same session share
#   the same session_id and session_name list.
#
# Before writing an entry's `reflection`, ask:
#   - Did AI save time or add confusion?
#   - Did I understand why the fix worked?
#   - How might I prompt differently next time?

entries:
  - timestamp: 2026-09-17T14:20:00-04:00
    session_id: 9976e7eb-8da1-4f54-ba6a-3984223c67b2
    session_name:
      - first-get-oriented-and-locate-ai-log
    prompt: |
      First get oriented by reading claude.md and understanding what this repo
      is. Then read the prompting guide section i pasted below, and explain
      where the ai log should be set up.
    result: >
      AI read CLAUDE.md and README.md, confirmed neither file already had a
      home for an AI usage log, and recommended a standalone log file at the
      repo root rather than editing README.md (the fixed assignment brief) or
      CLAUDE.md (agent guidance, not a student deliverable). Verified by
      inspecting both files directly before deciding.
    reflection: >
      Asking the assistant to check for an existing convention before creating
      a new file avoided duplicating structure or overwriting the assignment
      spec. Next time, name the exact file(s) already suspected to be relevant
      up front to skip a round of orientation.

  - timestamp: 2026-09-17T14:47:00-04:00
    session_id: 9976e7eb-8da1-4f54-ba6a-3984223c67b2
    session_name:
      - first-get-oriented-and-locate-ai-log
    prompt: |
      I do not like the format of the ai usage log. is there a better document
      for keeping track of a log? for example yaml or json vs .md? for this
      type of log, that might be read by another human or it might be read by
      an ai to describe to a human how i work with ai. if that is the case,
      then prioritizing machine readability seems important. what do you
      think?
    result: >
      AI recommended YAML over markdown or JSON for this log's fixed-shape,
      repeating records, since YAML stays reliably machine-parseable while
      still supporting readable multiline text via block scalars, unlike
      loosely-structured markdown or comment-less JSON. Converted the seeded
      AI_USAGE_LOG.md entry into this file and removed the markdown version.
    reflection: >
      Framing the choice as human-readable vs. machine-readable surfaced a
      format decision worth settling while the log still had one entry, rather
      than migrating a large log later.

  - timestamp: 2026-09-19T13:30:00-04:00
    session_id: 549ca482-ffec-4c6e-a56d-151b52a57041
    session_name:
      - first-get-oriented-and-examine-classify-code
    prompt: |
      First get oriented by reading claude.md, readme.md, as well as the ai
      usage log. Then examine this code [pasted classify_song body]. This app
      is supposed to move songs around depending on the mood profile set by the
      user, but there are times when a song gets labeled as hype when it should
      not be hype. Tell me how this code is contributing to that problem or any
      other problem. Then propose the most optimal fix.
    result: >
      AI traced the symptom to one structural cause rather than a list of
      separate bugs: classify_song combined four conditions in a flat `or`
      chain, three of which (the favorite_genre match and the hype keyword
      test) are profile-independent and so acted as overrides that outvoted the
      one signal the user controls. Rather than reasoning from the code alone,
      it ran the 22 seed songs through the real classifier under three profiles
      and reproduced all three failures concretely: Hotel California (rock,
      energy 6) Hype at a threshold of 7; every rock song still Hype when the
      user asked for a mellow playlist; and four energy-1/2 ambient tracks
      thrown into Hype by setting Favorite genre to ambient. It also found two
      defects not asked about - the chill keyword test never fires even once on
      the seed data (wrong field), and title matching is case-sensitive while
      genre and artist are not. Danny chose to drop favorite_genre from
      classification entirely.
    reflection: >
      Asking for "the most optimal fix" rather than "fix it" got a root-cause
      restructure (two tiers: energy decides, keywords break ties) instead of
      four independent patches. The step that paid off most was making the
      assistant execute the code and print actual playlist membership before
      proposing anything - the favorite_genre=ambient failure was far more
      dramatic than reading the code suggested, and it reordered which bug
      mattered most. Next time, ask for the simulation up front.

  - timestamp: 2026-09-19T16:00:00-04:00
    session_id: 549ca482-ffec-4c6e-a56d-151b52a57041
    session_name:
      - first-get-oriented-and-examine-classify-code
    prompt: |
      Read agent_messages/2026-09-19-01-tester1-to-claude-cp.md and its
      attachment, then follow it. Before changing any code, tell me whether you
      disagree with anything in it.
    result: >
      A second AI session (tester1) reviewed the test-first work before the fix
      landed and found a real contradiction: the test demanded Hotel California
      be "Mixed" at the default profile while the regression guard demanded the
      default split stay 11/6/5 - and Hotel California is one of those 11, so
      both could never pass. It also caught that extending keyword matching from
      a fixed-selectbox genre onto free-text titles and tags made substring
      matching unsafe ("Rocket Man" would read as a rock song), and that the
      helper crashed on tags=None. Rather than accepting the review on trust,
      this session re-ran every claim: the 16-red/12-guard gate reproduced
      exactly, the TypeError reproduced, and the substring misfires reproduced.
      All findings held. Two things the review missed were found and fixed with
      authorization - normalize_song has the same tags=None defect one layer up,
      where it crashes at render time, and the range slider had no automated
      coverage at all, now covered by 20 AppTest checks.
    reflection: >
      Having one AI review another's tests before the fix landed caught an error
      no amount of re-reading my own work would have: the test and the design
      disagreed, and the test was wrong. Worth noting that verifying the review
      took minutes and was worth it - not because anything in it was wrong, but
      because "all fourteen claims checked out" is a much stronger basis for
      acting than "an agent told me so." The reviewer's own blind spot was the
      half it couldn't execute: it ran nothing in Streamlit and said so plainly,
      which is exactly where the remaining gap turned out to be.
